<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82c4"/>
      <stop offset="1" stop-color="#1f4f85"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="#163a63" stroke-width="2"/>
  <!-- name banner -->
  <rect x="22" y="21" width="84" height="26" rx="13" fill="#f4f7fb"/>
  <text x="64" y="39" text-anchor="middle" font-family="sans-serif" font-weight="700"
        font-size="16" letter-spacing="0.3" fill="#163a63">T Bridge</text>
  <!-- bridge deck -->
  <rect x="24" y="100" width="80" height="8" rx="4" fill="#e9eef5"/>
  <!-- bridge arch -->
  <path d="M28 100 Q64 60 100 100" fill="none" stroke="#e9eef5" stroke-width="6" stroke-linecap="round"/>
  <!-- centre pylon -->
  <rect x="61" y="66" width="6" height="34" rx="3" fill="#e9eef5"/>
</svg>
